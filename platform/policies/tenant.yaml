apiVersion: v1
kind: ResourceQuota
metadata:
  name: playground-budget
  namespace: playground
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 1Gi
    limits.memory: 2Gi
    pods: "20"
    services: "10"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: playground-defaults
  namespace: playground
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 32Mi
      default:
        memory: 128Mi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer-observer
  namespace: playground
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer-observer
  namespace: playground
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-observer
  namespace: playground
subjects:
  - kind: ServiceAccount
    name: developer-observer
    namespace: playground
roleRef:
  kind: Role
  name: developer-observer
  apiGroup: rbac.authorization.k8s.io
