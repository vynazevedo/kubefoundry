apiVersion: apps/v1
kind: Deployment
metadata:
  name: primeiro-deployment
  namespace: fundamentos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: primeiro-deployment
  template:
    metadata:
      labels:
        app: primeiro-deployment
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: demo
        image: kubefoundry/demo:0.1.0
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 2
          failureThreshold: 1
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
