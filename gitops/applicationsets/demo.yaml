# Alternative to gitops/clusters/local/demo.yaml. Do not install both owners.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: learning-fleet
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: local
            server: https://kubernetes.default.svc
  template:
    metadata:
      name: 'demo-{{ .name }}'
    spec:
      project: playground
      source:
        repoURL: https://github.com/vynazevedo/kubefoundry.git
        targetRevision: main
        path: charts/demo
        helm:
          releaseName: demo
      destination:
        server: '{{ .server }}'
        namespace: playground
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - FailOnSharedResource=true
