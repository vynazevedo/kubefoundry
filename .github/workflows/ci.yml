name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate documentation links and image paths
        run: make docs-check
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/demo/go.mod
          cache: false
      - name: Install verified tools
        run: make tools
      - name: Unit tests, race detector, chart and shell checks
        run: make check
      - name: Create isolated cluster
        run: make up
      - name: Build and deploy workload
        run: make image deploy
      - name: Vulnerability scan and SBOM
        run: make security
      - name: Admission, RBAC and network controls
        run: make verify
      - name: GitOps reconciliation and database operator
        if: github.event_name != 'pull_request'
        run: make gitops database
      - name: Diagnostics on failure
        if: failure()
        env:
          KUBECONFIG: ${{ github.workspace }}/.state/kubeconfig
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp || true
      - name: Delete test cluster
        if: always()
        run: make down
